server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx'ning standart mime.types'ida ".mjs" yo'q (application/octet-stream bo'lib
  # qoladi) — to'g'ri Content-Type'siz `new Worker(url, {type:"module"})` (pdf.js)
  # brauzerda rad etiladi. Faqat shu kengaytmaga cheklangan (butun `types{}` jadvalini
  # almashtirmaydi — aks holda css/js/font'lar ham buzilib qolardi).
  location ~* \.mjs$ {
    default_type application/javascript;
  }

  # SPA — App.tsx ichki view-switching bilan ishlaydi (router yo'q), lekin kelgusida
  # URL-asoslangan navigatsiya qo'shilsa (M10 qoldig'i) deep-link'lar ishlashi uchun.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
